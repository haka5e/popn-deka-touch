[Touch]
; Window title the layer attaches to.
TargetWindow=Sub Screen
; Spice SDK button ids: 13 = Red Pop-Kun (left), 14 = Blue Pop-Kun (right).
RedButton=13
BlueButton=14
; 1 = layer is on when the game starts.
StartEnabled=1
; Keyboard toggle (Windows virtual-key code). 120 = F9, 0 = none.
ToggleKey=120
; 1 = show only while the game is the foreground program.
RequireFocus=1

; Touch area per side, as a percentage of the sub screen. It is invisible unless ShowZone=1.
ZoneWidthPercent=36
ZoneHeightPercent=62
ShowZone=0
; Pop-Kun picture: width, side margin (percent of screen width), gap below it (percent of screen height).
DomeSizePercent=31
DomeMarginPercent=3
DomeBottomPercent=1
; Camera height in degrees: 90 = straight down, 15 = almost from the front.
ViewAngle=45
; ON/OFF switch size.
ToggleScalePercent=100

; Opacity 0-255.
OverallAlpha=255
DomeAlpha=235
OffToggleAlpha=140

RedColor=E4202A
BlueColor=2A8FE0

; ---- Custom pictures -------------------------------------------------------
; Leave a value empty to keep the built-in look.
; Image paths: PNG (transparency supported), JPG or BMP. Relative paths start at the
;   folder of popn_deka_touch.dll, e.g. Image=deka\red.png
; Rect / TouchRect: x,y,width,height in pixels of a 1280x800 sub screen (0,0 = top left).
;   The picture is stretched to fill Rect exactly.

; NOTE: the Rect / TouchRect values below are the built-in defaults written out. While they are
;   filled in, they decide position and size, and DomeSizePercent, DomeMarginPercent,
;   DomeBottomPercent, ZoneWidthPercent, ZoneHeightPercent and ToggleScalePercent are ignored.
;   For the built-in Pop-Kun only the width and the bottom edge of Rect are used.

[Red]
; Picture when not pressed. Empty = built-in Pop-Kun.
Image=
; Picture while pressed. Empty = the same picture, a little brighter.
PressedImage=
; Where the picture goes. Empty = bottom left corner sized by DomeSizePercent,
;   keeping the image's own proportions.
Rect=38,409,397,383
; Area that counts as a press. Empty = same as Rect; if Rect is empty too, the
;   corner area from ZoneWidthPercent / ZoneHeightPercent.
TouchRect=0,304,461,496

[Blue]
Image=
PressedImage=
Rect=845,409,397,383
TouchRect=819,304,461,496

[Toggle]
; Pictures for the ON/OFF switch. Empty = built-in switch.
OnImage=
OffImage=
; Where the switch goes. Empty = top right corner.
Rect=1070,14,196,56
